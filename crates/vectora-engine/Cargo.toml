[package]
name = "vectora-engine"
version = "0.0.1"
description = "Rust engine core for reusable Vectora agent capabilities"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
arrow-array = "56.2"
arrow-schema = "56.2"
async-nats = { version = "0.52", features = ["server_2_11"] }
blake3 = "1.8"
getrandom = "0.3"
async-stream.workspace = true
async-trait = "0.1"
bytes.workspace = true
futures-core.workspace = true
futures-util.workspace = true
jsonschema.workspace = true
lancedb = { version = "0.22", default-features = false }
redis = { version = "0.27", features = ["tokio-comp"] }
reqwest.workspace = true
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
serde.workspace = true
serde_json.workspace = true
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "json"] }
thiserror.workspace = true
tokio.workspace = true
url.workspace = true

[lib]
path = "src/lib.rs"
