[workspace]
members = [
  "crates/vectora-engine",
  "bindings/python/native",
  "bindings/typescript/native",
]
resolver = "3"

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "AGPL-3.0-only"
repository = "https://github.com/vectora-company/engine"
rust-version = "1.88"

[workspace.dependencies]
async-stream = "0.3.6"
bytes = "1.10.1"
futures-core = "0.3.31"
futures-util = "0.3.31"
jsonschema = { version = "0.33.0", default-features = false }
reqwest = { version = "0.12.24", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["time", "sync", "rt-multi-thread", "macros"] }
url = "2.5.7"
pyo3 = { version = "0.27.1", features = ["extension-module"] }
pyo3-async-runtimes = { version = "0.27.0", features = ["tokio-runtime"] }
napi = { version = "3.0.0", features = ["tokio_rt"] }
napi-derive = "3.0.0"
