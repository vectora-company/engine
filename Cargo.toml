[workspace]
members = [
  "crates/vectora-engine",
  "crates/engine-cli",
  "bindings/python/native",
  "bindings/typescript/native",
]
resolver = "3"

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "AGPL-3.0-only"
repository = "https://github.com/vectora-company/engine"
rust-version = "1.95"

[workspace.dependencies]
async-trait = "0.1.92"
async-stream = "0.3.6"
base64 = "0.23"
bytes = "1.12.1"
futures-core = "0.3.34"
futures-util = "0.3.34"
jsonschema = { version = "0.61.2", default-features = false }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "stream", "multipart", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["time", "sync", "rt-multi-thread", "macros"] }
url = "2.5.8"
pyo3 = { version = "0.30.1", features = ["extension-module"] }
pyo3-async-runtimes = { version = "0.30.0", features = ["tokio-runtime"] }
napi = { version = "3.16.2", features = ["tokio_rt"] }
napi-derive = "3.7.1"
