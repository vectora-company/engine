name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, edited]
  push:
    branches: [main]
  workflow_call:
    inputs:
      checkout_ref:
        type: string
        required: false
        default: ""
      pr_title:
        type: string
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ inputs.checkout_ref || github.sha }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install Protocol Buffers compiler
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          version: "36.2"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: Swatinem/rust-cache@v2
      - name: Install Nextest
        uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: cargo-nextest@0.9.152
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check all targets and features
        run: cargo check --workspace --all-targets --all-features --locked
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Tests
        run: cargo nextest run --workspace --all-features --locked --test-threads 2
      # Nextest does not run rustdoc tests; keep Cargo's doctest runner too.
      - name: Documentation tests
        run: cargo test --workspace --all-features --doc --locked
      - name: Documentation
        run: cargo doc --workspace --all-features --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings

  rust-msrv:
    name: Rust / minimum supported version
    runs-on: ubuntu-24.04
    env:
      PYO3_PYTHON: python
      CARGO_BUILD_JOBS: 2
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.15"
      - uses: dtolnay/rust-toolchain@1.95.0
      - name: Install Protocol Buffers compiler
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          version: "36.2"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: Swatinem/rust-cache@v2
      - name: Check workspace at the declared MSRV
        run: cargo check --workspace --all-targets --all-features --locked

  rust-dependencies:
    name: Rust / unused dependencies
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
          persist-credentials: false
      - name: Install cargo-machete
        uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: cargo-machete@0.10.1
      - name: Find unused dependencies
        run: cargo machete

  rust-supply-chain:
    name: Rust / dependency policy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
          persist-credentials: false
      - name: Check advisories, licenses, duplicate versions, and sources
        uses: EmbarkStudios/cargo-deny-action@995303aa121612dcd7bbd5b92550ed2d6fc70af9 # v2.1.2
        with:
          rust-version: "1.95.0"
          command: check
          arguments: --all-features

  repository-tooling:
    name: Shared repository tooling
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-uv
        with:
          python-version: "3.13"
          sync: "false"
      - run: uv sync --locked --all-groups
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Protocol Buffers compiler
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          version: "36.2"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: Swatinem/rust-cache@v2
      - name: Build and install Python binding
        working-directory: bindings/python
        run: uv run --project ../.. maturin develop
      - name: Python syntax
        run: uv run --no-project python -m compileall -q -j0 utils bindings/python
      - name: Ruff lint
        run: uv run ruff check utils bindings/python
      - name: Ruff format
        run: uv run ruff format --check utils bindings/python
      - name: Python type check
        run: uv run ty check utils bindings/python
      - name: Python security scan
        run: uv run bandit -s B101 -r utils bindings/python
      - name: Python tests
        run: uv run pytest

  typescript-bindings:
    name: TypeScript bindings
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.0
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Protocol Buffers compiler
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          version: "36.2"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: Swatinem/rust-cache@v2
      - name: Install locked dependencies
        run: pnpm --dir bindings/typescript install --frozen-lockfile
      - name: Build native addon and TypeScript package
        run: pnpm --dir bindings/typescript build
      - name: TypeScript lint
        run: pnpm --dir bindings/typescript exec oxlint --deny-warnings src test
      - name: Type check
        run: pnpm --dir bindings/typescript typecheck
      - name: Tests
        run: pnpm --dir bindings/typescript test

  pull-request-metadata:
    if: github.event_name == 'pull_request' || inputs.pr_title != ''
    name: Pull request metadata
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Install commit title validator
        run: npm install --no-save --no-audit --no-fund @commitlint/cli@21.2.4 @commitlint/config-conventional@21.2.4
      - name: Validate Conventional Commit title
        run: |
          printf '%s\n' 'module.exports = { extends: ["@commitlint/config-conventional"] };' > .commitlintrc.cjs
          printf '%s\n' "$PR_TITLE" | npx commitlint --verbose
        env:
          PR_TITLE: ${{ inputs.pr_title || github.event.pull_request.title }}
